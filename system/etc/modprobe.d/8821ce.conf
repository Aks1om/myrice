# RTL8821CE (out-of-tree 8821ce / rtl8821ce-dkms) — disable driver power saving.
#
# Symptom: Wi-Fi drops during ACTIVE use. wpa_supplicant logs
#   "CTRL-EVENT-DISCONNECTED ... reason=3 locally_generated=1"
# i.e. the client tears the link down itself. beacon loss = 0, so it is
# NOT a weak-signal problem.
#
# Cause: the driver's internal power management was enabled
# (rtw_power_mgnt=2). The radio enters LPS/IPS, loses sync, and the driver
# locally deauths. The nl80211 power_save (iw) reported "off", but that is a
# different layer — this driver runs its own LPS regardless.
#
# Fix: rtw_power_mgnt=0 (no leisure power save) + rtw_ips_mode=0 (no idle
# power save / radio-off-when-idle). Both params confirmed via
# `modinfo -p 8821ce`. Takes effect on next boot (or module reload).
#
# Added 2026-05-24 (Wi-Fi mid-use drop fix).
options 8821ce rtw_power_mgnt=0 rtw_ips_mode=0
