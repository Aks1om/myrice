[Settings]
backend = hyprpaper
folder = ~/wallpaper
fill = fill
language = ru
number_of_columns = 4
post_command = mkdir -p ~/.local/share/hyprpaper && ln -sfn "$wallpaper" ~/.local/share/hyprpaper/current-wallpaper
monitors = All
show_path_in_tooltip = True
sort = name
color = #000000
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = True
use_xdg_state = True
