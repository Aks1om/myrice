general {
  lock_cmd = pidof hyprlock || hyprlock
  # Give hyprlock time to acquire the session lock before suspend cuts rendering.
  before_sleep_cmd = loginctl lock-session; sleep 1
  after_sleep_cmd = hyprctl eval "hl.dispatch(hl.dsp.dpms('on'))"
}

listener {
  timeout = 300
  on-timeout = loginctl lock-session
}

listener {
  timeout = 360
  on-timeout = hyprctl eval "hl.dispatch(hl.dsp.dpms('off'))"
  on-resume = hyprctl eval "hl.dispatch(hl.dsp.dpms('on'))"
}

listener {
  timeout = 1800
  on-timeout = loginctl lock-session; sleep 1; systemctl suspend
}
